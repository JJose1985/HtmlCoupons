<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Lookup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #1f2937;
    }

    main {
      max-width: 720px;
      margin: 4rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 0.5rem;
      box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 10%);
    }

    form {
      display: flex;
      gap: 0.75rem;
    }

    input,
    button {
      padding: 0.75rem;
      font: inherit;
    }

    input {
      flex: 1;
    }

    button {
      border: 0;
      border-radius: 0.25rem;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }

    #status {
      min-height: 1.5rem;
      margin: 1rem 0;
    }

    .error {
      color: #b91c1c;
    }

    .product-details {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.75rem 1rem;
      padding-top: 1rem;
      border-top: 1px solid #d1d5db;
    }

    dt {
      font-weight: 700;
    }

    dd {
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Product Lookup</h1>
    <p>Enter a product serial number to retrieve its details.</p>

    <form id="product-form">
      <label for="serial-number">Serial number</label>
      <input id="serial-number" name="serialNumber" required placeholder="Example: SN-10001">
      <button type="submit">Search</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="product-result" hidden aria-labelledby="product-name">
      <h2 id="product-name"></h2>
      <dl class="product-details">
        <dt>Serial number</dt>
        <dd id="product-serial-number"></dd>
        <dt>Description</dt>
        <dd id="product-description"></dd>
        <dt>Manufacturer</dt>
        <dd id="product-manufacturer"></dd>
        <dt>Availability</dt>
        <dd id="product-availability"></dd>
        <dt>Price</dt>
        <dd id="product-price"></dd>
      </dl>
    </section>
  </main>

  <script>
    const form = document.querySelector("#product-form");
    const serialNumberInput = document.querySelector("#serial-number");
    const status = document.querySelector("#status");
    const result = document.querySelector("#product-result");

    function setProductField(id, value) {
      document.querySelector(id).textContent = value;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const serialNumber = serialNumberInput.value.trim();
      result.hidden = true;
      status.className = "";

      if (!serialNumber) {
        status.textContent = "Enter a serial number.";
        status.classList.add("error");
        return;
      }

      status.textContent = "Loading product information...";

      try {
        const response = await fetch(`/api/products/${encodeURIComponent(serialNumber)}`);
        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.message || "Unable to retrieve product information.");
        }

        setProductField("#product-name", body.name);
        setProductField("#product-serial-number", body.serialNumber);
        setProductField("#product-description", body.description);
        setProductField("#product-manufacturer", body.manufacturer);
        setProductField("#product-availability", body.availability);
        setProductField("#product-price", new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD"
        }).format(body.price));

        status.textContent = "";
        result.hidden = false;
      } catch (error) {
        status.textContent = error.message;
        status.classList.add("error");
      }
    });
  </script>
</body>
</html>
